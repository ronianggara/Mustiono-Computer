<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1a2230;--mut:#6b7686;--pri:#0f766e;--prit:#fff;--bd:#e2e6ec;--red:#c0392b;--amb:#b7791f;--grn:#2f855a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11161d;--card:#1a212b;--tx:#e6ebf2;--mut:#93a0b2;--pri:#2dd4bf;--prit:#06231f;--bd:#2a3340;--red:#f08070;--amb:#f6c453;--grn:#6ee7a0}}
:root[data-theme=dark]{--bg:#11161d;--card:#1a212b;--tx:#e6ebf2;--mut:#93a0b2;--pri:#2dd4bf;--prit:#06231f;--bd:#2a3340;--red:#f08070;--amb:#f6c453;--grn:#6ee7a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{display:flex;min-height:100vh}aside{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;color:var(--pri);padding:4px 8px 12px}nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav a{padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mut)}nav a.on{background:var(--pri);color:var(--prit)}nav a:hover:not(.on){background:var(--bg)}
.usr{font-weight:600;display:flex;flex-direction:column;gap:6px}.usr small{color:var(--mut);font-weight:400}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{font-size:22px;font-weight:700}.mut{color:var(--mut)}.lbl{font-size:12px;color:var(--mut)}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.btn{padding:8px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
.btn.pri{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}.btn.del{color:var(--red)}.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.row>*{flex:0 0 auto}.row .grow{flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor}
.ok{color:var(--grn)}.low{color:var(--amb)}.out{color:var(--red)}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.pi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer}.pi:hover{border-color:var(--pri)}.pi b{display:block}
.ci{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}
.q{display:flex;gap:6px;align-items:center}.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--pri);border-radius:5px 5px 0 0;min-height:2px}
.big{font-size:28px;font-weight:700;color:var(--pri);margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.rcp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.rcp .l{display:flex;justify-content:space-between;gap:8px}.rcp hr{border:0;border-top:1px dashed var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:10}
.login{max-width:340px;margin:12vh auto;padding:0 14px}
@media(max-width:820px){.shell{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}.brand{padding:4px 8px}.usr{flex-direction:row;align-items:center;margin-left:auto}.pos{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#modal .rcp,#modal .rcp *{visibility:visible}#modal .rcp{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fdt=d=>new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const KEY='pos_db_v1',RL={admin:'Admin',kepala:'Kepala Toko',kasir:'Kasir'};
const MENU={dashboard:['Dashboard','admin','kepala'],kasir:['Kasir','admin','kepala','kasir'],produk:['Produk','admin','kepala'],inventori:['Inventori','admin','kepala'],laporan:['Laporan','admin','kepala','kasir'],pengaturan:['Pengaturan','admin']};
let DB,ME=null,VIEW='kasir',cart=[],Q='',CAT='',ASK=null,R={};
function seed(){const P=(sku,nama,kategori,harga,modal,stok,min)=>({id:uid()+sku,sku,nama,kategori,harga,modal,stok,min});
return{settings:{nama:'Toko Saya',alamat:'Alamat toko',telp:'',pajak:0,footer:'Terima kasih atas kunjungan Anda'},
users:[{id:'u1',nama:'Administrator',user:'admin',pass:'admin123',role:'admin'},{id:'u2',nama:'Kepala Toko',user:'kepala',pass:'kepala123',role:'kepala'},{id:'u3',nama:'Kasir 1',user:'kasir',pass:'kasir123',role:'kasir'}],
products:[P('MNM-001','Kopi Susu','Minuman',18000,8000,50,10),P('MNM-002','Es Teh Manis','Minuman',6000,2000,80,15),P('MNM-003','Air Mineral 600ml','Minuman',4000,2500,120,24),P('MKN-001','Nasi Goreng','Makanan',22000,11000,30,8),P('MKN-002','Mie Ayam','Makanan',18000,8500,25,8),P('SNK-001','Keripik Singkong','Snack',9000,5000,40,10),P('SNK-002','Roti Cokelat','Snack',7000,4000,6,10),P('LNN-001','Tisu Saku','Lainnya',3000,1500,60,10)],sales:[],stocklog:[]}}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB||!DB.settings)DB=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function toast(m){const t=$('#toast');t.innerHTML=`<div class=toast>${esc(m)}</div>`;clearTimeout(R.t);R.t=setTimeout(()=>t.innerHTML='',2400)}
function modal(h){$('#modal').innerHTML=`<div class=ov onclick="if(event.target==this)closeM()"><div class=box>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function ask(msg,fn){ASK=fn;modal(`<p>${esc(msg)}</p><div class=row><button class=btn onclick=closeM()>Batal</button><button class="btn pri" onclick="closeM();ASK()">Ya, lanjutkan</button></div>`)}
function login(){$('#app').innerHTML=`<div class=login><div class=card><h2>${esc(DB.settings.nama)}</h2><div class=mut>Masuk ke aplikasi kasir</div><label>Username</label><input id=lu autocomplete=username><label>Password</label><input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')doLogin()"><div id=le class=out style="margin-top:8px"></div><div class=row><button class="btn pri grow" onclick=doLogin()>Masuk</button></div><p class=lbl style="margin-top:14px">Akun awal: admin/admin123 · kepala/kepala123 · kasir/kasir123. Segera ganti di menu Pengaturan.</p></div></div>`}
function doLogin(){const u=DB.users.find(x=>x.user==$('#lu').value.trim()&&x.pass==$('#lp').value);if(!u){$('#le').textContent='Username atau password salah';return}ME=u;VIEW=MENU.dashboard.includes(u.role)?'dashboard':'kasir';shell()}
function logout(){ME=null;cart=[];login()}
function go(v){VIEW=v;shell()}
function shell(){if(!ME)return login();$('#app').innerHTML=`<div class=shell><aside><div class=brand>${esc(DB.settings.nama)}</div><nav>${Object.entries(MENU).filter(([k,v])=>v.slice(1).includes(ME.role)).map(([k,v])=>`<a class="${VIEW==k?'on':''}" onclick="go('${k}')">${v[0]}</a>`).join('')}</nav><div class=usr><span>${esc(ME.nama)}<br><small>${RL[ME.role]}</small></span><button class="btn sm" onclick=logout()>Keluar</button></div></aside><main id=main></main></div>`;V[VIEW]()}
const inRange=(s,a,b)=>{const d=dk(s.tgl);return d>=a&&d<=b};
const mySales=()=>ME.role=='kasir'?DB.sales.filter(s=>s.kasir==ME.nama):DB.sales;
const laba=s=>s.items.reduce((a,i)=>a+i.qty*(i.harga-i.modal),0);
const stat=p=>p.stok<=0?['Habis','out']:p.stok<=p.min?['Menipis','low']:['Aman','ok'];
const V={
dashboard(){const t=dk(new Date()),S=DB.sales.filter(s=>dk(s.tgl)==t),om=S.reduce((a,s)=>a+s.total,0),lb=S.reduce((a,s)=>a+laba(s),0),low=DB.products.filter(p=>p.stok<=p.min);
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=dk(d);return{l:d.toLocaleDateString('id-ID',{weekday:'short'}),v:DB.sales.filter(s=>dk(s.tgl)==k).reduce((a,s)=>a+s.total,0)}}),mx=Math.max(1,...days.map(d=>d.v));
const tp={};DB.sales.forEach(s=>s.items.forEach(i=>tp[i.nama]=(tp[i.nama]||0)+i.qty));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
$('#main').innerHTML=`<h2>Dashboard</h2><div class="grid g4"><div class=card><div class=lbl>Penjualan hari ini</div><div class=stat>${rp(om)}</div></div><div class=card><div class=lbl>Transaksi hari ini</div><div class=stat>${S.length}</div></div><div class=card><div class=lbl>Laba kotor hari ini</div><div class=stat>${rp(lb)}</div></div><div class=card><div class=lbl>Stok menipis / habis</div><div class="stat ${low.length?'low':''}">${low.length}</div></div></div>
<div class="grid g2"><div class=card><h3>Penjualan 7 hari terakhir</h3><div class=bars>${days.map(d=>`<div title="${rp(d.v)}"><i style="height:${d.v/mx*100}%"></i>${d.l}</div>`).join('')}</div></div>
<div class=card><h3>Produk terlaris</h3>${top.length?`<table>${top.map(([n,q])=>`<tr><td>${esc(n)}</td><td class=r>${q} terjual</td></tr>`).join('')}</table>`:'<p class=mut>Belum ada penjualan.</p>'}</div></div>
<div class=card><h3>Perlu restok</h3>${low.length?`<div class=tw><table><tr><th>Produk</th><th class=r>Stok</th><th class=r>Min</th><th>Status</th></tr>${low.map(p=>`<tr><td>${esc(p.nama)}</td><td class=r>${p.stok}</td><td class=r>${p.min}</td><td><span class="tag ${stat(p)[1]}">${stat(p)[0]}</span></td></tr>`).join('')}</table></div>`:'<p class=mut>Semua stok aman.</p>'}</div>`},
kasir(){const cats=[...new Set(DB.products.map(p=>p.kategori))];$('#main').innerHTML=`<h2>Kasir</h2><div class=pos><div><div class=row style="margin:0"><input class=grow id=sq placeholder="Cari nama / SKU..." value="${esc(Q)}" oninput="Q=this.value;grid()"><select id=sc onchange="CAT=this.value;grid()" style="width:auto"><option value="">Semua kategori${cats.map(c=>`<option ${c==CAT?'selected':''}>${esc(c)}`).join('')}</select></div><div class=pg id=grid></div></div><div class=card id=cart></div></div>`;grid();rc()},
produk(){$('#main').innerHTML=`<h2>Produk</h2><div class=card><div class=row style="margin:0 0 10px"><input class=grow placeholder="Cari produk..." oninput="R.pq=this.value;pt()"><button class="btn pri" onclick="pForm()">+ Tambah barang</button></div><div class=tw id=pt></div></div>`;pt()},
inventori(){const nilai=DB.products.reduce((a,p)=>a+p.stok*p.modal,0);$('#main').innerHTML=`<h2>Inventori</h2><div class="grid g4"><div class=card><div class=lbl>Jumlah produk</div><div class=stat>${DB.products.length}</div></div><div class=card><div class=lbl>Total unit stok</div><div class=stat>${DB.products.reduce((a,p)=>a+p.stok,0)}</div></div><div class=card><div class=lbl>Nilai stok (modal)</div><div class=stat>${rp(nilai)}</div></div></div>
<div class=card><h3>Stok barang</h3><div class=tw><table><tr><th>SKU</th><th>Produk</th><th class=r>Stok</th><th class=r>Min</th><th>Status</th><th class=r>Nilai</th><th></th></tr>${DB.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.nama)}</td><td class=r>${p.stok}</td><td class=r>${p.min}</td><td><span class="tag ${stat(p)[1]}">${stat(p)[0]}</span></td><td class=r>${rp(p.stok*p.modal)}</td><td><button class="btn sm" onclick="sForm('${p.id}')">Sesuaikan</button></td></tr>`).join('')}</table></div></div>
<div class=card><h3>Riwayat perubahan stok</h3><div class=tw><table><tr><th>Waktu</th><th>Produk</th><th class=r>Perubahan</th><th>Keterangan</th><th>Oleh</th></tr>${DB.stocklog.slice(-30).reverse().map(l=>`<tr><td>${fdt(l.tgl)}</td><td>${esc(l.nama)}</td><td class=r>${l.qty>0?'+':''}${l.qty}</td><td>${esc(l.ket)}</td><td>${esc(l.oleh)}</td></tr>`).join('')||'<tr><td colspan=5 class=mut>Belum ada catatan.</td></tr>'}</table></div></div>`},
laporan(){const t=dk(new Date());R.a=R.a||t.slice(0,8)+'01';R.b=R.b||t;$('#main').innerHTML=`<h2>${ME.role=='kasir'?'Riwayat Transaksi':'Laporan'}</h2><div class=card><div class=row style="margin:0"><div><label style="margin:0">Dari</label><input type=date id=ra value="${R.a}" onchange="R.a=this.value;lap()"></div><div><label style="margin:0">Sampai</label><input type=date id=rb value="${R.b}" onchange="R.b=this.value;lap()"></div>${ME.role!='kasir'?'<button class="btn pri" onclick=expLap() style="margin-top:16px">Ekspor laporan (.xlsx)</button>':''}</div></div><div id=lp></div>`;lap()},
pengaturan(){const s=DB.settings;$('#main').innerHTML=`<h2>Pengaturan</h2><div class="grid g2"><div class=card><h3>Data perusahaan</h3><label>Nama usaha</label><input id=s1 value="${esc(s.nama)}"><label>Alamat</label><input id=s2 value="${esc(s.alamat)}"><label>Telepon</label><input id=s3 value="${esc(s.telp)}"><label>Pajak / PPN (%)</label><input id=s4 type=number min=0 value="${s.pajak}"><label>Catatan kaki struk</label><input id=s5 value="${esc(s.footer)}"><div class=row><button class="btn pri" onclick=saveS()>Simpan</button></div></div>
<div class=card><h3>Database spreadsheet</h3><p class=mut>Semua data (produk, transaksi, stok, akun) disimpan di browser ini dan dapat diekspor / diimpor sebagai file Excel (.xlsx) dengan sheet: Perusahaan, Pengguna, Produk, Transaksi, DetailTransaksi, LogStok.</p><div class=row><button class="btn pri" onclick=expAll()>Ekspor semua data</button><label class=btn style="margin:0">Impor .xlsx<input type=file accept=".xlsx" hidden onchange="impX(this.files[0]);this.value=''"></label><button class="btn del" onclick="ask('Hapus SEMUA data dan kembali ke data awal?',()=>{DB=seed();save();logout()})">Reset data</button></div></div></div>
<div class=card><div class=row style="margin:0 0 10px"><h3 style="margin:0" class=grow>Akun pengguna</h3><button class="btn pri" onclick="uForm()">+ Tambah akun</button></div><div class=tw><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${DB.users.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.user)}</td><td>${RL[u.role]}</td><td><button class="btn sm" onclick="uForm('${u.id}')">Ubah</button> ${u.id!=ME.id?`<button class="btn sm del" onclick="delU('${u.id}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div></div>`}};
function grid(){const q=Q.toLowerCase();$('#grid').innerHTML=DB.products.filter(p=>(!CAT||p.kategori==CAT)&&(p.nama+p.sku).toLowerCase().includes(q)).map(p=>`<div class=pi onclick="add('${p.id}')"><b>${esc(p.nama)}</b><span class=lbl>${esc(p.kategori)}</span><div>${rp(p.harga)}</div><span class="lbl ${stat(p)[1]}">Stok ${p.stok}</span></div>`).join('')||'<p class=mut>Produk tidak ditemukan.</p>'}
function add(id){const p=DB.products.find(x=>x.id==id),c=cart.find(x=>x.id==id);if((c?c.qty:0)+1>p.stok)return toast('Stok tidak cukup');c?c.qty++:cart.push({id,qty:1});rc()}
function qty(id,d){const c=cart.find(x=>x.id==id),p=DB.products.find(x=>x.id==id);c.qty+=d;if(c.qty>p.stok){c.qty=p.stok;toast('Stok tidak cukup')}if(c.qty<=0)cart=cart.filter(x=>x!=c);rc()}
function tot(){const sub=cart.reduce((a,c)=>a+c.qty*DB.products.find(p=>p.id==c.id).harga,0),pj=Math.round(sub*(DB.settings.pajak||0)/100);return{sub,pj,total:sub+pj}}
function rc(){const t=tot();$('#cart').innerHTML=`<h3>Keranjang</h3>${cart.map(c=>{const p=DB.products.find(x=>x.id==c.id);return`<div class=ci><div><b>${esc(p.nama)}</b><div class=lbl>${rp(p.harga)}</div></div><div class=q><button onclick="qty('${c.id}',-1)">−</button>${c.qty}<button onclick="qty('${c.id}',1)">+</button></div><b>${rp(p.harga*c.qty)}</b></div>`}).join('')||'<p class=mut>Klik produk untuk menambah.</p>'}<div class=ci><span>Subtotal</span><span>${rp(t.sub)}</span></div>${DB.settings.pajak>0?`<div class=ci><span>Pajak ${DB.settings.pajak}%</span><span>${rp(t.pj)}</span></div>`:''}<div class=ci><b>Total</b><b class=stat>${rp(t.total)}</b></div><div class=row><button class="btn" onclick="cart=[];rc()">Kosongkan</button><button class="btn pri grow" onclick=pay()>Bayar</button></div>`}
function pay(){if(!cart.length)return toast('Keranjang kosong');const t=tot();modal(`<h3>Pembayaran</h3><div class=big>${rp(t.total)}</div><label>Metode</label><select id=met onchange=kb()><option>Tunai<option>QRIS<option>Debit<option>Transfer</select><label>Uang diterima</label><input id=byr type=number value="${t.total}" oninput=kb()><div id=kbl style="margin-top:8px;font-weight:600"></div><div class=row><button class=btn onclick=closeM()>Batal</button><button class="btn pri grow" onclick=done()>Selesaikan</button></div>`);kb()}
function kb(){const t=tot().total,b=+$('#byr').value||0;$('#kbl').innerHTML=b>=t?`Kembalian: ${rp(b-t)}`:`<span class=out>Kurang ${rp(t-b)}</span>`}
function done(){const t=tot(),m=$('#met').value,b=+$('#byr').value||0;if(m=='Tunai'&&b<t.total)return toast('Uang kurang');const d=dk(new Date()).replace(/-/g,''),n=DB.sales.filter(s=>s.id.includes(d)).length+1;
const s={id:'TRX-'+d+'-'+String(n).padStart(4,'0'),tgl:new Date().toISOString(),kasir:ME.nama,items:cart.map(c=>{const p=DB.products.find(x=>x.id==c.id);p.stok-=c.qty;DB.stocklog.push({tgl:new Date().toISOString(),pid:p.id,nama:p.nama,qty:-c.qty,ket:'Penjualan',oleh:ME.nama});return{pid:p.id,nama:p.nama,qty:c.qty,harga:p.harga,modal:p.modal}}),subtotal:t.sub,pajak:t.pj,total:t.total,bayar:m=='Tunai'?b:t.total,metode:m};
DB.sales.push(s);save();cart=[];rc();grid();struk(s)}
function struk(s){const c=DB.settings;modal(`<div class=rcp><div style="text-align:center"><b>${esc(c.nama)}</b><br>${esc(c.alamat)}<br>${esc(c.telp)}</div><hr><div>${s.id}<br>${fdt(s.tgl)} · ${esc(s.kasir)}</div><hr>${s.items.map(i=>`<div>${esc(i.nama)}</div><div class=l><span>${i.qty} x ${rp(i.harga)}</span><span>${rp(i.qty*i.harga)}</span></div>`).join('')}<hr><div class=l><span>Subtotal</span><span>${rp(s.subtotal)}</span></div>${s.pajak?`<div class=l><span>Pajak</span><span>${rp(s.pajak)}</span></div>`:''}<div class=l><b>Total</b><b>${rp(s.total)}</b></div><div class=l><span>${s.metode}</span><span>${rp(s.bayar)}</span></div><div class=l><span>Kembali</span><span>${rp(s.bayar-s.total)}</span></div><hr><div style="text-align:center">${esc(c.footer)}</div></div><div class=row><button class=btn onclick="try{print()}catch(e){}">Cetak</button><button class="btn pri grow" onclick=closeM()>Tutup</button></div>`)}
function pt(){const q=(R.pq||'').toLowerCase();$('#pt').innerHTML=`<table><tr><th>SKU</th><th>Nama</th><th>Kategori</th><th class=r>Harga</th><th class=r>Modal</th><th class=r>Stok</th><th></th></tr>${DB.products.filter(p=>(p.nama+p.sku+p.kategori).toLowerCase().includes(q)).map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.nama)}</td><td>${esc(p.kategori)}</td><td class=r>${rp(p.harga)}</td><td class=r>${rp(p.modal)}</td><td class=r>${p.stok}</td><td><button class="btn sm" onclick="pForm('${p.id}')">Ubah</button> <button class="btn sm del" onclick="delP('${p.id}')">Hapus</button></td></tr>`).join('')}</table>`}
function pForm(id){const p=DB.products.find(x=>x.id==id)||{sku:'',nama:'',kategori:'',harga:'',modal:'',stok:0,min:5};modal(`<h3>${id?'Ubah':'Tambah'} barang</h3><label>SKU / Kode</label><input id=f1 value="${esc(p.sku)}"><label>Nama barang</label><input id=f2 value="${esc(p.nama)}"><label>Kategori</label><input id=f3 value="${esc(p.kategori)}"><label>Harga jual</label><input id=f4 type=number value="${p.harga}"><label>Harga modal</label><input id=f5 type=number value="${p.modal}">${id?'':`<label>Stok awal</label><input id=f6 type=number value="0">`}<label>Stok minimum</label><input id=f7 type=number value="${p.min}"><div class=row><button class=btn onclick=closeM()>Batal</button><button class="btn pri grow" onclick="saveP('${id||''}')">Simpan</button></div>`)}
function saveP(id){const v=k=>$('#'+k).value.trim(),o={sku:v('f1'),nama:v('f2'),kategori:v('f3')||'Umum',harga:+v('f4'),modal:+v('f5'),min:+v('f7')||0};if(!o.nama||!o.harga)return toast('Nama dan harga wajib diisi');
if(id)Object.assign(DB.products.find(x=>x.id==id),o);else{o.id=uid();o.stok=+v('f6')||0;DB.products.push(o);if(o.stok)DB.stocklog.push({tgl:new Date().toISOString(),pid:o.id,nama:o.nama,qty:o.stok,ket:'Stok awal',oleh:ME.nama})}save();closeM();V[VIEW]()}
function delP(id){ask('Hapus barang ini?',()=>{DB.products=DB.products.filter(p=>p.id!=id);cart=cart.filter(c=>c.id!=id);save();pt()})}
function sForm(id){const p=DB.products.find(x=>x.id==id);modal(`<h3>Sesuaikan stok</h3><p>${esc(p.nama)} — stok saat ini <b>${p.stok}</b></p><label>Jenis</label><select id=j><option value=in>Barang masuk (+)<option value=out>Barang keluar / rusak (−)<option value=set>Stok opname (set jumlah)</select><label>Jumlah</label><input id=jq type=number min=0><label>Keterangan</label><input id=jk placeholder="cth. Pembelian dari supplier"><div class=row><button class=btn onclick=closeM()>Batal</button><button class="btn pri grow" onclick="saveS2('${id}')">Simpan</button></div>`)}
function saveS2(id){const p=DB.products.find(x=>x.id==id),j=$('#j').value,n=+$('#jq').value;if(isNaN(n)||$('#jq').value==='')return toast('Isi jumlah');const d=j=='in'?n:j=='out'?-n:n-p.stok;if(p.stok+d<0)return toast('Stok tidak boleh negatif');p.stok+=d;DB.stocklog.push({tgl:new Date().toISOString(),pid:id,nama:p.nama,qty:d,ket:$('#jk').value||({in:'Barang masuk',out:'Barang keluar',set:'Stok opname'})[j],oleh:ME.nama});save();closeM();V.inventori()}
function lap(){const S=mySales().filter(s=>inRange(s,R.a,R.b)),om=S.reduce((a,s)=>a+s.total,0),lb=S.reduce((a,s)=>a+laba(s),0),pm={},pp={};S.forEach(s=>{pm[s.metode]=(pm[s.metode]||0)+s.total;s.items.forEach(i=>{const x=pp[i.nama]||(pp[i.nama]={q:0,o:0,l:0});x.q+=i.qty;x.o+=i.qty*i.harga;x.l+=i.qty*(i.harga-i.modal)})});R.S=S;
$('#lp').innerHTML=`<div class="grid g4"><div class=card><div class=lbl>Transaksi</div><div class=stat>${S.length}</div></div><div class=card><div class=lbl>Omzet</div><div class=stat>${rp(om)}</div></div>${ME.role!='kasir'?`<div class=card><div class=lbl>Laba kotor</div><div class=stat>${rp(lb)}</div></div>`:''}<div class=card><div class=lbl>Rata-rata / transaksi</div><div class=stat>${rp(S.length?om/S.length:0)}</div></div></div>
<div class=card><h3>Transaksi</h3><div class=tw><table><tr><th>No</th><th>Waktu</th><th>Kasir</th><th>Metode</th><th class=r>Total</th><th></th></tr>${S.slice().reverse().map(s=>`<tr><td>${s.id}</td><td>${fdt(s.tgl)}</td><td>${esc(s.kasir)}</td><td>${s.metode}</td><td class=r>${rp(s.total)}</td><td><button class="btn sm" onclick="struk(DB.sales.find(x=>x.id=='${s.id}'))">Struk</button></td></tr>`).join('')||'<tr><td colspan=6 class=mut>Tidak ada transaksi pada periode ini.</td></tr>'}</table></div></div>
<div class="grid g2"><div class=card><h3>Per metode bayar</h3><table>${Object.entries(pm).map(([k,v])=>`<tr><td>${k}</td><td class=r>${rp(v)}</td></tr>`).join('')||'<tr><td class=mut>-</td></tr>'}</table></div><div class=card><h3>Per produk</h3><div class=tw><table><tr><th>Produk</th><th class=r>Qty</th><th class=r>Omzet</th>${ME.role!='kasir'?'<th class=r>Laba</th>':''}</tr>${Object.entries(pp).sort((a,b)=>b[1].o-a[1].o).map(([k,x])=>`<tr><td>${esc(k)}</td><td class=r>${x.q}</td><td class=r>${rp(x.o)}</td>${ME.role!='kasir'?`<td class=r>${rp(x.l)}</td>`:''}</tr>`).join('')||'<tr><td class=mut>-</td></tr>'}</table></div></div></div>`}
function saveS(){Object.assign(DB.settings,{nama:$('#s1').value,alamat:$('#s2').value,telp:$('#s3').value,pajak:+$('#s4').value||0,footer:$('#s5').value});save();toast('Pengaturan disimpan');shell()}
function uForm(id){const u=DB.users.find(x=>x.id==id)||{nama:'',user:'',pass:'',role:'kasir'};modal(`<h3>${id?'Ubah':'Tambah'} akun</h3><label>Nama lengkap</label><input id=u1 value="${esc(u.nama)}"><label>Username</label><input id=u2 value="${esc(u.user)}"><label>Password</label><input id=u3 value="${esc(u.pass)}"><label>Peran</label><select id=u4>${Object.entries(RL).map(([k,v])=>`<option value=${k} ${k==u.role?'selected':''}>${v}`).join('')}</select><div class=row><button class=btn onclick=closeM()>Batal</button><button class="btn pri grow" onclick="saveU('${id||''}')">Simpan</button></div>`)}
function saveU(id){const o={nama:$('#u1').value.trim(),user:$('#u2').value.trim(),pass:$('#u3').value,role:$('#u4').value};if(!o.nama||!o.user||!o.pass)return toast('Semua kolom wajib diisi');if(DB.users.some(x=>x.user==o.user&&x.id!=id))return toast('Username sudah dipakai');if(id){const u=DB.users.find(x=>x.id==id);if(u.id==ME.id&&o.role!='admin')return toast('Tidak bisa menurunkan peran akun sendiri');Object.assign(u,o)}else DB.users.push({id:uid(),...o});save();closeM();V.pengaturan()}
function delU(id){ask('Hapus akun ini?',()=>{DB.users=DB.users.filter(u=>u.id!=id);save();V.pengaturan()})}
async function saveX(wb,name){try{const d=window.claude&&await claude.use('downloads');if(!d)return toast('Unduhan tidak tersedia di tampilan ini');const a=XLSX.write(wb,{type:'array',bookType:'xlsx'});await d.save({filename:name,data:new Uint8Array(a)})}catch(e){if(!e||e.code!='declined')toast('Gagal mengunduh')}}
const sh=(wb,n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n);
function expAll(){const wb=XLSX.utils.book_new();sh(wb,'Perusahaan',[DB.settings]);sh(wb,'Pengguna',DB.users);sh(wb,'Produk',DB.products);sh(wb,'Transaksi',DB.sales.map(({items,...r})=>r));sh(wb,'DetailTransaksi',DB.sales.flatMap(s=>s.items.map(i=>({trx:s.id,...i}))));sh(wb,'LogStok',DB.stocklog);saveX(wb,'database-kasir-'+dk(new Date())+'.xlsx')}
function expLap(){const wb=XLSX.utils.book_new(),S=R.S||[];sh(wb,'Transaksi',S.map(({items,...r})=>({...r,laba:laba({items})})));sh(wb,'Detail',S.flatMap(s=>s.items.map(i=>({trx:s.id,produk:i.nama,qty:i.qty,harga:i.harga,modal:i.modal,subtotal:i.qty*i.harga}))));saveX(wb,`laporan-${R.a}_${R.b}.xlsx`)}
function impX(f){if(!f)return;const r=new FileReader();r.onload=e=>ask('Impor akan MENGGANTI seluruh data saat ini. Lanjutkan?',()=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),g=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]):[];const D={settings:g('Perusahaan')[0]||DB.settings,users:g('Pengguna'),products:g('Produk'),stocklog:g('LogStok'),sales:[]};if(!D.users.some(u=>u.role=='admin'))throw 0;const det=g('DetailTransaksi');D.sales=g('Transaksi').map(s=>({...s,items:det.filter(d=>d.trx==s.id).map(({trx,...i})=>i)}));DB=D;save();ME=null;toast('Impor berhasil, silakan masuk kembali');login()}catch(x){toast('File tidak valid (harus ada akun admin & sheet yang sesuai)')}});r.readAsArrayBuffer(f)}
load();login();
</script>
