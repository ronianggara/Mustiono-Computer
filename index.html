<script type="text/plain" id="gs">const SECRET='ganti-dengan-rahasia-anda';
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function put(n,r){var ss=SpreadsheetApp.getActive(),s=ss.getSheetByName(n)||ss.insertSheet(n);s.clear();if(r.length)s.getRange(1,1,r.length,r[0].length).setValues(r)}
function doPost(e){var b=JSON.parse(e.postData.contents);if(b.secret!==SECRET)return out({ok:false,error:'Secret salah'});var d=b.data;
put('_DB',(JSON.stringify(d).match(/[\s\S]{1,40000}/g)||[]).map(function(x){return [x]}));
put('Transaksi',[['Nota','Tanggal','Cabang','Kasir','Pelanggan','Total','Metode','Status Servis','Void']].concat(d.tx.map(function(t){return [t.inv,t.date,t.br,t.cashier,t.cust,t.total,t.pay,t.svc,t.void?'ya':'']})));
put('Servis',[['Nota','Pelanggan','Unit','Status']].concat(d.tx.filter(function(t){return t.svc!='none'&&!t.void}).map(function(t){return [t.inv,t.cust,t.device,t.svc]})));
put('Barang_Gudang',[['Nama','Jenis','Kategori','Barcode','Modal','Jual','Stok','Min','Gudang','Cabang']].concat(d.items.map(function(i){return [i.name,i.type,i.cat,i.barcode,i.buy,i.sell,i.stock,i.min,i.wh,i.br]})));
put('Cabang',[['ID','Nama','Alamat','Telp']].concat(d.br.map(function(x){return [x.id,x.name,x.addr,x.phone]})));
put('Pengguna',[['ID','Nama','Role','Cabang']].concat(d.users.map(function(x){return [x.id,x.name,x.role,x.br]})));
return out({ok:true})}
function doGet(e){if(e.parameter.secret!==SECRET)return out({ok:false,error:'Secret salah'});var s=SpreadsheetApp.getActive().getSheetByName('_DB');if(!s)return out({ok:false,error:'Belum ada data'});return out({ok:true,data:JSON.parse(s.getDataRange().getValues().map(function(r){return r[0]}).join(''))})}</script>
<script>

const V={};

a.forEach(t=>{if(pie=='pay')g[PAY[t.pay]]=(g[PAY[t.pay]]||0)+t.total;else t.items.forEach(i=>{const k=i.cat||'Lainnya';g[k]=(g[k]||0)+i.qty*i.price})});
const E=Object.entries(g),T=sum(E.map(e=>({v:e[1]})),'v')||1,C=['#2563EB','#059669','#D97706','#DC2626','#7C3AED','#0891B2'];let ac=0;
const cg=E.map((e,i)=>{const s=ac;ac+=e[1]/T*100;return `${C[i%6]} ${s}% ${ac}%`}).join(',')||'#E2E8F0 0 100%';

return `<div class="row"><select onchange="per=this.value;go()">${Object.entries(P).map(e=>`<option value="${e[0]}" ${per==e[0]?'selected':''}>${e[1]}</option>`).join('')}</select><button onclick="txCSV(txs().filter(t=>inPer(t.date,per)),'rekap-'+per)">Download Rekap (CSV / Excel)</button></div>
<div class="grid"><div class="card">Total Omzet<div class="big">${rp(sum(a,'total'))}</div></div><div class="card">Total Transaksi<div class="big">${a.length}</div></div><div class="card">Servis Berjalan<div class="big">${sv} unit</div></div><div class="card">Laba Estimasi<div class="big" style="color:var(--g)">${rp(lb)}</div></div></div>
<div class="card"><div class="row"><button class="${pie=='cat'?'on2':'o'}" onclick="pie='cat';go()">Per Kategori</button><button class="${pie=='pay'?'on2':'o'}" onclick="pie='pay';go()">Per Metode Bayar</button></div>
<div class="row" style="gap:20px"><div class="pie" style="background:conic-gradient(${cg})"></div><div>${E.map((e,i)=>`<div><span style="color:${C[i%6]}">●</span> ${esc(e[0])}: ${Math.round(e[1]/T*100)}% (${rp(e[1])})</div>`).join('')||'Belum ada transaksi pada periode ini.'}</div></div></div>
<div class="card"><h3>Transaksi Terbaru</h3>${txs().slice(-5).reverse().map(t=>`<div class="row"><b style="flex:1">${t.inv}<br><small>${esc(t.cust)}</small></b>${rp(t.total)} ${stat(t)}</div>`).join('')||'Belum ada transaksi.'}<button class="o" onclick="go('rep')">Lihat Semua Laporan</button></div>`};
V.pos=()=>`<div class="row"><input id="q" style="flex:1" placeholder="Cari nama / barcode" value="${esc(q)}" oninput="q=this.value;posGrid()"><button onclick="scan(defScan)">📷 Scan</button></div>

const ICO={'Jasa Servis':'🛠️','Sparepart Laptop':'💾','Aksesoris PC':'🔌','Storage':'💽','Software/OS':'💿'};
function gridH(){const L=db.items.filter(i=>i.br==br&&(cat=='Semua'||i.cat==cat)&&(!q||(i.name+i.barcode).toLowerCase().includes(q.toLowerCase())));
